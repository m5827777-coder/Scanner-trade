name: 🤖 Trading Bot

on:
  schedule:
    # Каждые 30 минут: ~1 мин на запуск ≈ 1500 мин/мес, влезает в бесплатные 2000 мин для приватного репо.
    # 6-часовой email-отчёт отправляется из обычного скана (проверка lastReport), отдельный cron не нужен.
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action'
        required: false
        default: 'scan'
        type: choice
        options: [scan, report, close_all, reset_state]

# Не запускать два скана одновременно: оба пишут state.json и пушат в main
concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: cd bot && npm install

      - name: Run bot
        env:
          TG_TOKEN:       ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID:     ${{ secrets.TG_CHAT_ID }}
          EMAIL_TO:       ${{ secrets.EMAIL_TO }}
          GMAIL_USER:     ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          ACTION:         ${{ github.event.inputs.action || 'scan' }}
        run: cd bot && node index.js

      - name: Save state
        run: |
          git config user.name  "TradingBot"
          git config user.email "bot@noreply.github.com"
          git add data/ dashboard/
          git diff --staged --quiet || git commit -m "scan #$(python3 -c 'import json;d=json.load(open(\"data/state.json\"));print(d.get(\"scanCount\",0))')" && git push
